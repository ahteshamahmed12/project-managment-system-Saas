[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "bcrypt==4.0.1",
    "beanie<2.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "motor>=3.7.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1"
]

# The Vercel service root is `Backend/` (see vercel.json), so the module path is
# relative to this directory. `main.py` uses flat imports (`from database import ...`)
# and there is no `Backend/__init__.py`, so `Backend.main:app` would fail to import.
[tool.vercel]
entrypoint = "main:app"
